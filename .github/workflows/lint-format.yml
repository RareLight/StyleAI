name: "Lint/format check"
on: [push, pull_request]
jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Linting (Python)
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15.11"
          args: "check"
          src: >-
            ./server/src
            ./server/test
      - name: Formatting (Python)
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15.11"
          args: "format --check --diff"
          src: >-
            ./server/src
            ./server/test
      - name: Formatting (Lua)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.4.1
          args: --check plugin/StyleAI.lrdevplugin
      - name: Linting (Lua)
        uses: lunarmodules/luacheck@v1
        with:
          args: plugin/StyleAI.lrdevplugin
