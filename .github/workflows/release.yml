name: Build StyleAI Plugin and Server

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    # Run on dev for build validation and on version tags for releases.
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            arch: x64
          - os: macos-latest
            os_name: macos
            arch: arm64

    name: Build StyleAI - ${{ matrix.os_name }}-${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_SHA="${GITHUB_SHA}"
          git fetch origin main
          if git branch -r --contains "$TAG_SHA" | grep -q "origin/main"; then
            echo "Tag commit is contained in origin/main."
          else
            echo "Error: Tag commit is not contained in origin/main."
            exit 1
          fi

      - name: Update Info.lua with version and build date
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          REVISION=$(echo "$VERSION" | cut -d. -f3)
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          REVISION=${REVISION:-0}
          BUILD_DATE=$(date +%Y%m%d)
          INFO_LUA="plugin/StyleAI.lrdevplugin/Info.lua"
          sed 's/Info.MAJOR = .*/Info.MAJOR = '"$MAJOR"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.MINOR = .*/Info.MINOR = '"$MINOR"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.REVISION = .*/Info.REVISION = '"$REVISION"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.BUILD = [0-9]*/Info.BUILD = '"$BUILD_DATE"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          echo "Updated Info.lua: MAJOR=$MAJOR MINOR=$MINOR REVISION=$REVISION build=$BUILD_DATE"

      - name: Update backend version info from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BUILD_DATE=$(date +%Y%m%d)
          VERSION_FILE="server/src/version_info.py"
          cat > "$VERSION_FILE" <<EOF
          BACKEND_VERSION = "${VERSION}"
          BACKEND_RELEASE_TAG = "v${VERSION}"
          BACKEND_BUILD = ${BUILD_DATE}
          EOF
          echo "Updated backend version info: version=${VERSION} build=${BUILD_DATE}"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Sync locked build environment
        run: uv sync --project server --locked --dev

      - name: Build styleai-server
        env:
          KMP_DUPLICATE_LIB_OK: 'TRUE'
        run: uv run --project server pyinstaller styleai_server.spec --noconfirm
          
      - name: Prepare plugin files
        shell: bash
        run: |
          BUILD_DIR="build"
          PLUGIN_DIR="$BUILD_DIR/StyleAI.lrplugin"
          
          mkdir -p $PLUGIN_DIR
          
          echo "Copying server and model files..."
          cp -r dist/* $BUILD_DIR/
          
          echo "Copying plugin files..."
          cp plugin/StyleAI.lrdevplugin/*.lua $PLUGIN_DIR/
          cp plugin/StyleAI.lrdevplugin/TranslatedStrings_*.txt $PLUGIN_DIR/

          if [ "${{ matrix.os_name }}" == "macos" ]; then
            if [ -f "$BUILD_DIR/styleai-server/styleai-server" ]; then
              echo "Setting executable permissions for macOS server binary..."
              chmod +x $BUILD_DIR/styleai-server/styleai-server
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: styleai-${{ matrix.os_name }}-${{ matrix.arch }}
          path: build/
          retention-days: 1

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-release]
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: styleai-*
          path: artifacts
      
      - name: Zip artifacts
        run: |
          VERSION=${{ github.ref_name }}
          
          cd artifacts
          
          if [ -d "styleai-windows-x64" ]; then
            cd styleai-windows-x64
            zip -r ../StyleAI-windows-x64-${VERSION}.zip .
            cd ..
          fi

          if [ -d "styleai-macos-arm64" ]; then
            cd styleai-macos-arm64
            zip -r ../StyleAI-macos-arm64-${VERSION}.zip .
            cd ..
          fi

          cd ..

      - name: Set release metadata
        id: release-meta
        run: |
          VERSION="${{ github.ref_name }}"
          echo "release_name=Release ${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          TAG="${VERSION}"
          # Auto-generierte Release Notes von GitHub (falls möglich)
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${TAG}" \
            -q '.body' > release_notes.md 2>/dev/null || echo -n "" > release_notes.md
          # Standard-Hinweise zu Known Issues und manuellen Schritten anhängen
          cat >> release_notes.md << 'NOTES'

          ## Known issues
          This release has issues with Windows Smartscreen and macOS Gatekeeper, which will prevent the start of the StyleAI backend. You will get an error in Lightroom that the StyleAI database cannot be started.
          Which means depending on your platform there are necessary manual steps to do before the first use. 

          ## Manual steps
          **macOS**
          - Open a Terminal
          - `cd <directory with contents of the downloaded zip file>`
          - `chmod +x styleai-server/styleai-server`
          - `xattr -dr com.apple.quarantine styleai-server`

          **Windows**
          - Open Explorer go to folder where you extracted the zip file.
          - Go to the styleai-server sub directory.
          - Double-click styleai-server.exe
          - A Windows Smartscreen warning will appear.
          - Click More -> Run anyway

          NOTES

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release-meta.outputs.release_name }}
          body_path: release_notes.md
          files: |
            artifacts/StyleAI-windows-x64-${{ github.ref_name }}.zip
            artifacts/StyleAI-macos-arm64-${{ github.ref_name }}.zip
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
