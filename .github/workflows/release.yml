name: Build release packages

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            executable: dist/styleai-server/styleai-server
          - os: windows-latest
            platform: windows-x64
            executable: dist/styleai-server/styleai-server.exe
    steps:
      - uses: actions/checkout@v6
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate_release_version.py "$RELEASE_TAG"
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked dependencies
        run: uv sync --project server --locked --dev
      - name: Validate plug-in
        run: python scripts/validate_lrc_plugin.py
      - name: Freeze backend
        run: uv run --project server pyinstaller styleai_server.spec --noconfirm
      - name: Smoke test frozen backend
        run: python scripts/smoke_release_backend.py ${{ matrix.executable }}
      - name: Package release
        shell: bash
        env:
          BUILD_REF: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$BUILD_REF"
          else
            VERSION="build-${GITHUB_SHA:0:12}"
          fi
          python scripts/package_release.py --backend dist/styleai-server --platform '${{ matrix.platform }}' --version "$VERSION" --output release
      - uses: actions/upload-artifact@v6
        with:
          name: styleai-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: styleai-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: 'Extract the complete archive and follow INSTALL.md inside. Builds are unsigned; macOS builds are not notarized.'
          files: release/*
          fail_on_unmatched_files: true
