[project]
name = "styleai-coreml-ane-benchmark"
version = "0.1.0"
description = "Isolated Core ML / Apple Neural Engine feasibility benchmark for StyleAI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools==9.0",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "open-clip-torch==3.3.0",
    "pillow>=11",
    "psutil>=6",
    "safetensors>=0.5",
    "timm>=1.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers>=4.46",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["test_benchmark.py"]
