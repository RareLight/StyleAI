# styleai-server using the published GHCR image (same backend as a GitHub release).
#
# Default: :latest (multi-arch; CI publishes it on each release tag — see publish-docker-manifest).
# Override in .env, e.g. STYLEAI_IMAGE=ghcr.io/rarelight/styleai:v1.2.3-x64
#
# Stop:  docker compose down
# Logs:  docker compose logs -f styleai-server

services:
  styleai-server:
    image: ${STYLEAI_IMAGE:-ghcr.io/rarelight/styleai:latest}
    container_name: styleai-server
    restart: unless-stopped
    ports:
      - "19819:19819"
    volumes:
      - ./data:/data
      - ./models:/models
    environment:
      - STYLEAI_HOST=0.0.0.0
      - STYLEAI_PORT=19819

      - STYLEAI_FACES_CLUSTER_ENABLED=true
      - STYLEAI_FACES_CLUSTER_INTERVAL=3600
      - STYLEAI_FACES_CLUSTER_DISTANCE=0.5
      - STYLEAI_FACES_CLUSTER_MIN_FACES=3
      - STYLEAI_FACES_CLUSTER_LINKAGE=complete

      - STYLEAI_BACKUP_ENABLED=true
      - STYLEAI_BACKUP_INTERVAL=86400
      - STYLEAI_BACKUP_MAX_KEEP=14
