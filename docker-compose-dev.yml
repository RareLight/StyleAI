# styleai-server built from ./server (local backend development).
# The image embeds version_info.py from your working tree; use a release-matching
# plugin or dev placeholders as usual.
#
# Start: docker compose -f docker-compose-dev.yml up -d --build
# Stop:  docker compose -f docker-compose-dev.yml down
# Logs:  docker compose -f docker-compose-dev.yml logs -f styleai-server

services:
  styleai-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: styleai-server:dev
    container_name: styleai-server
    restart: unless-stopped
    ports:
      - "19819:19819"
    volumes:
      - ./data:/data
      - ./models:/models
      - ./gcloud:/root/.config/gcloud
    environment:
      - STYLEAI_HOST=0.0.0.0
      - STYLEAI_PORT=19819
      - CLOUDSDK_CONFIG=/root/.config/gcloud

      - STYLEAI_FACES_CLUSTER_ENABLED=true
      - STYLEAI_FACES_CLUSTER_INTERVAL=3600
      - STYLEAI_FACES_CLUSTER_DISTANCE=0.5
      - STYLEAI_FACES_CLUSTER_MIN_FACES=3
      - STYLEAI_FACES_CLUSTER_LINKAGE=complete

      - STYLEAI_BACKUP_ENABLED=true
      - STYLEAI_BACKUP_INTERVAL=86400
      - STYLEAI_BACKUP_MAX_KEEP=14
